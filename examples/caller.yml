# Положить в подключаемый репозиторий как .github/workflows/security.yml.
# Это весь код, который нужен на стороне проекта.
name: security

on:
  pull_request:
  push: { branches: [main] }
  schedule:
    # Прогон по расписанию нужен не для порядка: уязвимость в зависимости
    # появляется без единого коммита в проект, и без него репозиторий, где
    # месяц не было изменений, месяц считается проверенным.
    - cron: "0 3 * * *"

permissions:
  contents: read
  actions: read            # сборка артефактов прогона в job report
  security-events: write   # SARIF в Code Scanning
  pull-requests: write     # комментарий со сводкой

jobs:
  security:
    uses: dato-dev/DevSecOpsCommonPipeline/.github/workflows/security.yml@v1
    with:
      # Раннер — тоже переменная репозитория: на своём раннере поставьте
      # SEC_RUNS_ON=self-hosted. Нужен docker — job'ы идут в container:.
      runs_on: ${{ vars.SEC_RUNS_ON || 'ubuntu-latest' }}
    secrets:
      DD_TOKEN: ${{ secrets.DD_TOKEN }}
      # Секреты в reusable workflow не наследуются — каждый пробрасывается явно.
      # PEM корневого сертификата, если DefectDojo за самоподписанным.
      DD_CA_CERT: ${{ secrets.DD_CA_CERT }}
